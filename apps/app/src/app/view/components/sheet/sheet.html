<div
  #panel
  class="rk-sheet-panel"
  [class.rk-sheet-panel-bottom]="config.mode === 'bottom'"
  [class.rk-sheet-panel-full]="config.mode === 'full'"
  [class.rk-sheet-panel-closing]="sheetRef.closing()"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="headingId"
>
  @if (config.mode === 'bottom') {
    <span class="rk-sheet-grabber" aria-hidden="true"></span>
  }

  <div class="rk-sheet-header">
    <!--
      Focus lands on the heading rather than the first control, matching what PageFocus does on
      navigation - so opening a sheet and opening a focused screen sound the same to a screen
      reader user, and reading starts at the title instead of mid-form.

      `initialFocus: 'content'` hands that over to the content's own `cdkFocusInitial` element. The
      attribute has to go away for that to work: the focus trap takes the first match in document
      order, and the heading is always ahead of the body. The heading keeps `tabindex="-1"` either
      way, and `aria-labelledby` still names the dialog, so it is announced on entry regardless.
    -->
    <h2
      [id]="headingId"
      class="min-w-0 flex-1"
      tabindex="-1"
      [attr.cdkFocusInitial]="config.initialFocus === 'heading' ? '' : null"
    >
      {{ config.heading }}
    </h2>

    @if (config.dismissible) {
      <button type="button" class="rk-icon-button" (click)="sheetRef.dismiss()">
        <svg lucideX class="rk-icon" aria-hidden="true"></svg>
        <span class="sr-only">{{ config.dismissLabel }}</span>
      </button>
    }
  </div>

  <div class="rk-sheet-body">
    <ng-container *ngComponentOutlet="content; injector: contentInjector" />
  </div>
</div>
