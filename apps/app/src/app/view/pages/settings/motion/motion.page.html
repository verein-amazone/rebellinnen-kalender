<app-focused-screen heading="Animationen" fallbackLink="/settings">
  <!-- Animation everywhere in the app, like „Textgröße“ an accessibility setting. „Wenig“ also
       stops the Tagesimpuls greeting, which used to have a screen of its own. -->
  <fieldset class="space-y-2">
    <legend class="sr-only">Animationen wählen</legend>

    @for (option of appearance.motionOptions; track option.id) {
      <app-choice-row
        name="motion"
        [value]="option.id"
        [label]="option.label"
        [description]="option.description"
        [checked]="appearance.motion() === option.id"
        (selected)="select($event)"
      />
    }
  </fieldset>
</app-focused-screen>
