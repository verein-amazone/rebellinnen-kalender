<app-focused-screen
  heading="Nutzungsbedingungen"
  fallbackLink="/settings"
  [returnTo]="safeReturnTo()"
>
  @if (markdown(); as terms) {
    <div class="rk-card px-4 py-5">
      <app-markdown-content [markdown]="terms" />
    </div>
  } @else {
    <p class="text-muted-foreground">
      Die Nutzungsbedingungen sind in diesem Build nicht verfügbar.
    </p>
  }
</app-focused-screen>
