<app-focused-screen heading="Farben" fallbackLink="/settings">
  <fieldset class="space-y-2">
    <legend class="sr-only">Farben wählen</legend>

    @for (option of appearance.themeOptions; track option.id) {
      <app-choice-row
        name="theme"
        [value]="option.id"
        [label]="option.label"
        [description]="option.description"
        [checked]="appearance.theme() === option.id"
        (selected)="select($event)"
      >
        <app-theme-swatch [theme]="option.id" />
      </app-choice-row>
    }
  </fieldset>
</app-focused-screen>
