<!-- Pinned: the period nav and the Woche/Monat switcher stay put while the agenda below scrolls
     under them, the same `sticky top-0` pattern `focused-screen.scaffold.html`'s header uses. A
     background is required — without one the scrolling content behind would show through. `safe-top`
     sits here rather than on the shell's `<main>` (see that comment) so this header's own background
     — not whatever scrolls underneath it — fills the notch area. -->
<div class="bg-background safe-top sticky top-0 z-10">
  <!-- `py-2` here and `pt-4` on the scrollable block below reproduce the space
       `.rk-screen-header-bar` + `.rk-screen-body` reserve on a focused screen, so switching between
       this tab and a focused screen (e.g. event detail) doesn't shift where scrollable content
       starts. -->
  <div class="flex items-center gap-1 px-4 py-2">
    <!-- Visually hidden: the bottom navigation already shows where the user is. Still the screen's
         accessible name and the navigation focus target (see PageFocus). -->
    <h1 class="sr-only">Kalender</h1>

    <button
      type="button"
      class="rk-icon-button"
      [attr.aria-label]="previousLabel()"
      (click)="goToPrevious()"
    >
      <svg lucideChevronLeft class="rk-icon" aria-hidden="true"></svg>
    </button>
    <p class="min-w-0 flex-1 text-center font-semibold">{{ periodLabel() }}</p>
    <button
      type="button"
      class="rk-icon-button"
      [attr.aria-label]="nextLabel()"
      (click)="goToNext()"
    >
      <svg lucideChevronRight class="rk-icon" aria-hidden="true"></svg>
    </button>
    <button type="button" class="rk-button rk-button-ghost" (click)="goToToday()">Heute</button>
  </div>

  <fieldset class="px-4 pb-2">
    <legend class="sr-only">Ansicht</legend>
    <div class="bg-muted flex rounded-lg p-0.5">
      <label
        class="min-h-touch has-checked:bg-card has-focus-visible:ring-ring flex flex-1 cursor-pointer items-center justify-center rounded-md px-3 font-semibold has-checked:font-bold has-checked:shadow-sm has-focus-visible:ring-2"
      >
        <input
          type="radio"
          name="calendar-view"
          value="week"
          class="sr-only"
          [checked]="viewMode() === 'week'"
          (change)="setView('week')"
        />
        Woche
      </label>
      <label
        class="min-h-touch has-checked:bg-card has-focus-visible:ring-ring flex flex-1 cursor-pointer items-center justify-center rounded-md px-3 font-semibold has-checked:font-bold has-checked:shadow-sm has-focus-visible:ring-2"
      >
        <input
          type="radio"
          name="calendar-view"
          value="month"
          class="sr-only"
          [checked]="viewMode() === 'month'"
          (change)="setView('month')"
        />
        Monat
      </label>
    </div>
  </fieldset>
</div>

<div class="space-y-4 px-4 pt-4 pb-6">
  <!-- On a card surface: the muted weekday and out-of-month text meets contrast on `card`, not on
       every theme's page background. -->
  <div class="rk-card p-2">
    <app-calendar-grid
      [view]="viewMode()"
      [selectedDay]="selectedDay()"
      [today]="today()"
      [markersByDay]="markersByDay()"
      (daySelected)="selectDay($event)"
    />
  </div>

  @if ((filterableCalendars.value() ?? []).length > 0) {
    <app-calendar-source-filter
      [calendars]="filterableCalendars.value() ?? []"
      [hiddenIds]="hiddenCalendarIds()"
      (toggled)="toggleCalendar($event)"
    />
  }

  @if (occurrences.error()) {
    <div class="rk-card px-4 py-6">
      <p class="text-muted-foreground text-center">Die Termine konnten nicht geladen werden.</p>
    </div>
  } @else {
    <app-calendar-agenda
      [day]="selectedDay()"
      [occurrences]="loadedOccurrences()"
      [sourcesHidden]="allSourcesHidden()"
    />
  }
</div>
