<!-- `min-h-16` here and `pt-4` on the block below reproduce the space `.rk-screen-header-bar` +
     `.rk-screen-body` reserve on a focused screen, so switching between this tab and a focused
     screen (e.g. event detail) doesn't shift where scrollable content starts. `min-h-16` (64px),
     not `min-h-touch` (48px): the `<h1>` is `sr-only` and contributes no in-flow height, so nothing
     here is a touch target — the row exists purely to reserve the same 64px the other tabs' visible
     controls happen to fill on their own. -->
<div class="min-h-16 px-4 py-2">
  <h1 class="sr-only">Inhalte</h1>
</div>

<div class="space-y-4 px-4 pt-4 pb-6">
  <p class="text-muted-foreground">
    Anlaufstellen und die eigene Sammlung folgen mit den kuratierten Inhalten in Milestone 3.
  </p>
</div>
