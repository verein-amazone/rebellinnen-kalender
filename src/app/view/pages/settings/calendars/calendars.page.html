<app-focused-screen heading="Kalender verwalten" fallbackLink="/settings">
  <div class="space-y-6">
    <section class="space-y-2">
      <h2 class="text-muted-foreground text-sm">Diese App</h2>
      <p class="text-muted-foreground text-sm">
        Termine, die du direkt in der App anlegst, werden in diesem Kalender gespeichert.
      </p>

      @if (appCalendar(); as calendar) {
        <ul class="rk-list">
          <li>
            <button
              type="button"
              class="rk-row w-full text-left"
              (click)="editAppCalendarIdentity()"
            >
              <span class="rk-row-label flex items-center gap-2">
                <app-calendar-avatar [color]="calendar.color" [emoji]="calendar.emoji" />
                {{ calendar.name }}
              </span>
              <span class="rk-row-value">Bearbeiten</span>
            </button>
          </li>
        </ul>
      }
    </section>

    <section class="space-y-2">
      <h2 class="text-muted-foreground text-sm">Weitere Kalender</h2>
      <ul class="rk-list">
        <li>
          <a routerLink="/settings/calendars/curated" class="rk-row">
            <span class="rk-row-label">Amazone & Partnerkalender</span>
            <svg lucideChevronRight class="rk-icon-sm" aria-hidden="true"></svg>
          </a>
        </li>
        @if (isNativePlatform) {
          <li>
            <a routerLink="/settings/calendars/device" class="rk-row">
              <span class="rk-row-label">Gerätekalender</span>
              <svg lucideChevronRight class="rk-icon-sm" aria-hidden="true"></svg>
            </a>
          </li>
        }
        <li>
          <a routerLink="/settings/calendars/ics" class="rk-row">
            <span class="rk-row-label">Abonnierte Kalender</span>
            <svg lucideChevronRight class="rk-icon-sm" aria-hidden="true"></svg>
          </a>
        </li>
      </ul>
    </section>
  </div>
</app-focused-screen>
