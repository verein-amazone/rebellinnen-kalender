<form (submit)="$event.preventDefault(); save()">
  <!-- Live preview: reflects the colour and emoji as they're picked, before saving. -->
  <span class="rk-pill mb-4" [style.--pill-color]="color()">
    @if (emoji(); as e) {
      <span aria-hidden="true">{{ e }}</span>
    }
    <span>{{ name() || 'Kalender' }}</span>
  </span>

  <label class="rk-label" for="calendar-identity-name">Name</label>
  <div class="rk-field">
    <input
      id="calendar-identity-name"
      class="rk-input"
      type="text"
      autocomplete="off"
      [attr.maxlength]="maxLength"
      [value]="name()"
      [attr.aria-invalid]="error() === '' ? null : 'true'"
      [attr.aria-describedby]="error() === '' ? null : 'calendar-identity-name-error'"
      (input)="updateName($any($event.target).value)"
    />
  </div>

  <!--
    Always in the DOM: a live region that appears together with its text is frequently not announced
    at all. See the contract in src/styles/components/field.css.
  -->
  <div aria-live="polite" aria-atomic="true">
    @if (error() !== '') {
      <p id="calendar-identity-name-error" class="rk-error">{{ error() }}</p>
    }
  </div>

  <div class="mt-4">
    <span class="rk-label" id="calendar-identity-emoji-label">Emoji</span>
    <div
      class="flex items-center gap-2"
      role="group"
      aria-labelledby="calendar-identity-emoji-label"
    >
      <button
        type="button"
        id="calendar-identity-emoji-picker"
        class="rk-icon-button text-2xl"
        (click)="pickEmoji()"
        [attr.aria-label]="'Emoji auswählen, aktuell ' + (emoji() ?? 'kein Emoji ausgewählt')"
      >
        <span aria-hidden="true">{{ emoji() ?? '➕' }}</span>
      </button>
      @if (emoji(); as e) {
        <button type="button" class="rk-button rk-button-ghost" (click)="clearEmoji()">
          Entfernen
        </button>
      }
    </div>
  </div>

  <div class="mt-4">
    <fieldset>
      <legend class="rk-label">Farbe</legend>
      <div class="grid grid-cols-6 gap-3">
        @for (swatch of palette; track swatch.hex) {
          <label
            class="has-checked:ring-foreground relative block aspect-square cursor-pointer rounded-full has-checked:ring-2 has-checked:ring-offset-2"
            [style.background-color]="swatch.hex"
          >
            <input
              type="radio"
              name="calendar-identity-color"
              class="sr-only"
              [value]="swatch.hex"
              [attr.aria-label]="swatch.name"
              [checked]="color() === swatch.hex"
              (change)="color.set(swatch.hex)"
            />
          </label>
        }
      </div>
    </fieldset>
  </div>

  <!-- Stacked and full width, like every other sheet: one action per line, easy to hit. -->
  <div class="rk-sheet-footer flex-col">
    <button type="submit" class="rk-button rk-button-primary w-full">Speichern</button>
    <button type="button" class="rk-button rk-button-ghost w-full" (click)="cancel()">
      Abbrechen
    </button>
  </div>
</form>
