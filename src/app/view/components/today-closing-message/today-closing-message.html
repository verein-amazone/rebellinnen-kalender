<div class="space-y-1 py-2 text-center" aria-live="polite" aria-atomic="true">
  @if (headline(); as text) {
    <p class="text-muted-foreground text-sm">{{ text }}</p>

    @if (supportingLine(); as line) {
      <p data-testid="supporting-line" class="text-muted-foreground text-xs">{{ line }}</p>
    }

    @if (appointment(); as occurrence) {
      <!-- Opened from Heute, so it also leaves back to Heute. `min-h-touch` and `hoverable:`
           rather than a bare `hover:`: this is a tap target on a touch device, where a sticky
           hover state would stay lit after the tap. -->
      <a
        [routerLink]="['/calendar', 'event', occurrence.id]"
        [queryParams]="{ returnTo: '/today' }"
        class="text-muted-foreground min-h-touch hoverable:underline inline-flex items-center justify-center text-xs underline-offset-2"
      >
        {{ occurrence.title }}
      </a>
    }
  }
</div>
