<div class="flex min-h-dvh flex-col">
  <div class="min-h-0 flex-1">
    <router-outlet />
  </div>

  @if (activeTab(); as active) {
    <nav
      class="bg-nav-bg text-rebel-text shrink-0 pb-[env(safe-area-inset-bottom)]"
      aria-label="Hauptbereiche"
    >
      <ul class="flex">
        @for (destination of destinations; track destination.tab) {
          <li class="flex-1">
            <a
              [routerLink]="destination.link"
              [attr.aria-current]="destination.tab === active ? 'page' : null"
              class="flex min-h-14 flex-col items-center justify-center gap-1 px-2 py-2 text-sm"
              [class.text-rebel-text]="destination.tab === active"
              [class.font-bold]="destination.tab === active"
              [class.text-rebel-text-muted]="destination.tab !== active"
            >
              @switch (destination.tab) {
                @case ('today') {
                  <svg lucideSun class="size-6" aria-hidden="true"></svg>
                }
                @case ('calendar') {
                  <svg lucideCalendarDays class="size-6" aria-hidden="true"></svg>
                }
                @case ('content') {
                  <svg lucideBookOpen class="size-6" aria-hidden="true"></svg>
                }
              }
              <span>{{ destination.label }}</span>
              <!-- Second, non-colour indicator so the active destination is not signalled by colour alone. -->
              <span
                class="bg-accent h-1 w-6 rounded-full"
                [class.invisible]="destination.tab !== active"
                aria-hidden="true"
              ></span>
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</div>
