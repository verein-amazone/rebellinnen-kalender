<!--
  A fixed viewport frame, not a growing document: only <main> scrolls, so the bottom navigation
  stays put however tall the content becomes. At large text sizes it is several viewports tall.
-->
<div class="flex h-dvh flex-col overflow-hidden">
  <!-- Every screen renders exactly one <h1> in here; PageFocus targets it on navigation. -->
  <!--
    Primary destinations have no header of their own, so the shell keeps their content clear of the
    notch. Focused screens do have one and apply the top inset to it instead, so that its background
    fills the notch area when the content scrolls underneath.
  -->
  <main class="rk-scroll-region safe-x" [class.safe-top]="activeTab() !== null">
    <router-outlet />
  </main>

  @if (activeTab(); as active) {
    <nav class="rk-tab-bar safe-bottom safe-x" aria-label="Hauptbereiche">
      <ul class="rk-tab-list">
        @for (destination of destinations; track destination.tab) {
          <li class="flex-1">
            <a
              [routerLink]="destination.link"
              [attr.aria-current]="destination.tab === active ? 'page' : null"
              class="rk-tab"
              [class.text-rebel-text]="destination.tab === active"
              [class.font-bold]="destination.tab === active"
              [class.text-rebel-text-muted]="destination.tab !== active"
            >
              @switch (destination.tab) {
                @case ('today') {
                  <svg lucideSun class="rk-tab-icon" aria-hidden="true"></svg>
                }
                @case ('calendar') {
                  <svg lucideCalendarDays class="rk-tab-icon" aria-hidden="true"></svg>
                }
                @case ('content') {
                  <svg lucideBookOpen class="rk-tab-icon" aria-hidden="true"></svg>
                }
              }
              <span>{{ destination.label }}</span>
              <!-- Second, non-colour indicator so the active destination is not signalled by colour alone. -->
              <span
                class="rk-tab-indicator"
                [class.invisible]="destination.tab !== active"
                aria-hidden="true"
              ></span>
            </a>
          </li>
        }
      </ul>
    </nav>
  }
</div>
