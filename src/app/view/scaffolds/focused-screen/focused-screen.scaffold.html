<div class="flex min-h-dvh flex-col">
  <header
    class="bg-background border-border sticky top-0 z-10 flex items-center gap-2 border-b px-2 py-2"
  >
    <button
      type="button"
      class="flex size-11 shrink-0 items-center justify-center rounded-lg"
      (click)="goBack()"
    >
      <svg lucideArrowLeft class="size-6" aria-hidden="true"></svg>
      <span class="sr-only">{{ backLabel() }}</span>
    </button>
    <h1 #headingElement tabindex="-1" class="min-w-0 text-xl">{{ heading() }}</h1>
  </header>

  <div class="flex-1 px-4 py-4">
    <ng-content />
  </div>
</div>
