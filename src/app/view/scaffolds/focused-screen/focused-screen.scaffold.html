<div class="flex min-h-dvh flex-col">
  <!--
    The safe-area inset sits on the <header> itself and the layout on the inner element, so the
    inset adds to the padding instead of competing with it for `padding-top`. The header background
    therefore fills the notch area while its content stays below it.
  -->
  <header class="bg-background border-border safe-top sticky top-0 z-10 border-b">
    <div class="rk-screen-header-bar">
      <button type="button" class="rk-icon-button" (click)="dismiss()">
        @if (dismissal() === 'close') {
          <svg lucideX class="rk-icon" aria-hidden="true"></svg>
        } @else {
          <svg lucideArrowLeft class="rk-icon" aria-hidden="true"></svg>
        }
        <span class="sr-only">{{ resolvedDismissLabel() }}</span>
      </button>
      <h1 class="min-w-0 text-xl">{{ heading() }}</h1>
    </div>
  </header>

  <!-- Focused screens have no bottom navigation, so they clear the home indicator themselves. -->
  <div class="safe-bottom flex-1">
    <div class="rk-screen-body">
      <ng-content />
    </div>
  </div>
</div>
