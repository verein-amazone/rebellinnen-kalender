<!-- `-mx-4 px-4`: breaks out of the page's own `px-4` gutter so the track scrolls edge-to-edge
     instead of being clipped by it, then puts the same 1rem gutter back as padding *inside* the
     scroll area - the same treatment the calendar's source filter uses. -->
<div class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-1" role="group" aria-label="Sammlung filtern">
  @for (kind of kinds(); track kind.id) {
    <button
      type="button"
      class="rk-pill min-h-touch shrink-0 transition-colors"
      [class.font-bold]="isVisible(kind.id)"
      [class.opacity-55]="!isVisible(kind.id)"
      [attr.aria-pressed]="isVisible(kind.id)"
      (click)="toggled.emit(kind.id)"
    >
      @if (isVisible(kind.id)) {
        <svg lucideCheck class="rk-icon-sm" aria-hidden="true"></svg>
      }
      <span>{{ kind.label }} · {{ kind.count }}</span>
    </button>
  }
</div>
