<div class="flex items-center justify-between gap-3">
  <!-- The screen's own title, so `PageFocus` announces the greeting on arrival rather than a
       generic „Heute“. The emoji button stays a sibling: inside the heading it would end up in
       that announcement. -->
  <!-- `hyphens-manual`: the global `hyphens: auto` split names at a syllable („Ka-rin“), which
       testers found disappointing. A name now moves to the next line whole; the base styles'
       `overflow-wrap: anywhere` still breaks one wider than the line at large text sizes. -->
  <h1 class="text-3xl leading-snug hyphens-manual">{{ greeting() }}</h1>

  <button
    type="button"
    class="rk-icon-button text-5xl"
    (click)="openEmojiPicker()"
    [attr.aria-label]="'Persönliches Emoji ändern, aktuell ' + emoji()"
  >
    <span aria-hidden="true">{{ emoji() }}</span>
  </button>
</div>
