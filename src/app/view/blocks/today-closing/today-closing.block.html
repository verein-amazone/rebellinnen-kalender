@if (data.error() !== undefined) {
  <div class="rk-card space-y-3 px-4 py-6 text-center">
    <p>Der Tagesabschluss konnte nicht geladen werden.</p>
    <button type="button" class="rk-button rk-button-ghost" (click)="reload()">
      Erneut versuchen
    </button>
  </div>
} @else if (data.status() === 'loading') {
  <!-- One headline line, one shorter supporting line — this block's own usual shape. -->
  <div class="space-y-2" aria-hidden="true">
    <span class="rk-skeleton block h-4 w-3/4"></span>
    <span class="rk-skeleton block h-3 w-1/2"></span>
  </div>
} @else if (headline(); as text) {
  <app-today-closing-message
    [headline]="text"
    [supportingLine]="supportingLine()"
    [appointment]="appointment()"
  />
}
