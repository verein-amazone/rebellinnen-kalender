<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <!--
      Defence in depth for a WebView that renders text from remote calendar feeds: nothing but the
      app's own files may run. Same origin is `capacitor://localhost` on iOS and
      `https://localhost` on Android; ICS feeds are fetched natively, outside this policy.
      - `wasm-unsafe-eval`: the browser build's SQLite is WebAssembly. It allows compiling Wasm only,
        not `eval`.
      - `style-src 'unsafe-inline'`: the CDK and the emoji picker insert `<style>` elements.
      - `connect-src blob:`: the web emoji picker loads its bundled data from a blob URL (no CDN
        since `@independo/capacitor-emoji-picker` 1.3.4). The native pickers load nothing.
      Keep the page free of inline scripts: the production build inlines no critical CSS for that
      reason (`inlineCritical: false` in angular.json), whose loader would be one.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' blob:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'"
    />
    <title>Rebell*innen</title>
    <base href="/" />
    <!--
      `viewport-fit=cover` lets the app use the full screen on devices with a notch or a home
      indicator. It is also what makes the `env(safe-area-inset-*)` values non-zero on iOS; without
      it the `.safe-*` utilities in src/styles/base.css silently do nothing.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The web demo build is a tool for looking at the app, not something to be found through a
      search engine, so no deployment may be indexed. This tag is the only way to say so: GitHub
      Pages cannot send an `X-Robots-Tag` header, and a crawler reads `robots.txt` only at the root
      of the host, which this project site does not own. Native builds ignore it.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      The web demo build only (see README). The manifest, the icons it names and the touch icon are
      resolved relative to this document, so one file serves the demo site and every pull-request
      preview, whichever subdirectory it is deployed to. Native builds ignore all of it. Safari on
      iOS takes its home-screen icon from `apple-touch-icon` rather than from the manifest.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#7dbdbb" />
    <!--
      Restores a deep link GitHub Pages could not serve (see the file). A classic script without
      `defer`, so it runs before the Angular bundle reads the location.
    -->
    <script src="restore-deep-link.js"></script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Bitte aktiviere JavaScript, um die Rebell*innen App zu verwenden.</noscript>
  </body>
</html>
