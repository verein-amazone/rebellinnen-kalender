<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <title>Rebell*innen Kalender</title>
    <base href="/" />
    <!--
      `viewport-fit=cover` lets the app use the full screen on devices with a notch or a home
      indicator. It is also what makes the `env(safe-area-inset-*)` values non-zero on iOS; without
      it the `.safe-*` utilities in src/styles/base.css silently do nothing.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      The web demo build is a tool for looking at the app, not something to be found through a
      search engine, so no deployment may be indexed. This tag is the only way to say so: GitHub
      Pages cannot send an `X-Robots-Tag` header, and a crawler reads `robots.txt` only at the root
      of the host, which this project site does not own. Native builds ignore it.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      The web demo build only (see README). The manifest, the icons it names and the touch icon are
      resolved relative to this document, so one file serves the demo site and every pull-request
      preview, whichever subdirectory it is deployed to. Native builds ignore all of it. Safari on
      iOS takes its home-screen icon from `apple-touch-icon` rather than from the manifest.
    -->
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#7dbdbb" />
    <!--
      Restores a deep link that GitHub Pages could not serve. Pages has no rewrite rule, so
      reloading `…/settings/theme` returns its 404 page, and `404.html` sends the request back here
      with the route as a query (`/?/settings/theme`). This puts it back in the address bar before
      the Angular bundle - a deferred module script - runs and reads the location.

      Inert everywhere else: without that query shape it does nothing at all.
    -->
    <script>
      (function () {
        if (window.location.search.charAt(1) !== '/') {
          return;
        }

        var parts = window.location.search.slice(2).split('&');
        var route = parts.shift();
        var query = parts.join('&');

        window.history.replaceState(
          null,
          '',
          window.location.pathname + route + (query ? '?' + query : '') + window.location.hash,
        );
      })();
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript>Bitte aktiviere JavaScript, um den Rebell*innen Kalender zu verwenden.</noscript>
  </body>
</html>
