# Dependabot configuration.
#
# Ownership is split with the weekly app-dependency-update workflow
# (.github/workflows/weekly-app-dependency-update.yml):
#
#   - In-range npm updates (minor/patch within the semver ranges in package.json) are handled by
#     that workflow, because they require a `cap sync` afterwards to keep the committed native
#     projects (ios/App/CapApp-SPM/Package.swift, Package.resolved, android capacitor.build.gradle)
#     consistent — something Dependabot cannot do.
#   - Dependabot therefore only proposes npm **majors** (range-crossing updates), plus
#     github-actions and gradle updates.
#   - Security updates are deliberately not throttled: they are a separate Dependabot feature that
#     ignores `schedule`, `cooldown`, `ignore` and `open-pull-requests-limit`, so advisories still
#     open a PR as soon as a fix is published.
#
# The swift ecosystem is intentionally absent: ios/App/CapApp-SPM/Package.swift is generated by the
# Capacitor CLI (`cap sync`) and contains pnpm store paths — Dependabot would fight the generator.
version: 2

updates:
  # ----------------------------------------------------------------- npm ----
  # Majors only; minor/patch land through the weekly update workflow (see header).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    # Let a major settle before proposing it, so versions that get pulled or hotfixed within days
    # never reach a PR.
    cooldown:
      default-days: 14
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Capacitor packages release in lockstep and are validated together; a split across PRs would
      # only produce a broken intermediate state. All other majors stay ungrouped on purpose — each
      # needs its own review.
      capacitor:
        patterns:
          - '@capacitor/*'
          - '@capacitor-community/*'
          - '@capawesome/*'
      angular:
        patterns:
          - '@angular/*'
          - 'angular-eslint'
          - '@angular-eslint/*'

  # -------------------------------------------------------------- gradle ----
  # android/build.gradle (AGP, google-services) is not managed by `cap sync`.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      android-minor-patch:
        update-types:
          - minor
          - patch

  # ------------------------------------------------------ github-actions ----
  # Keeps the SHA-pinned actions in .github/workflows fresh.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - '*'
