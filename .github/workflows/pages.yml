# Publishes the web demo build to GitHub Pages, and one preview per pull request.
#
# Layout of the published site (see README, "Web demo build"):
#
#   https://verein-amazone.github.io/rebellinnen-kalender/           <- the `dev` branch
#   https://verein-amazone.github.io/rebellinnen-kalender/pr-<n>/    <- one open pull request
#
# GitHub Pages allows a single publishing source per repository, and only the branch-based source
# can hold a directory per pull request, so this workflow maintains the `gh-pages` branch itself:
# the repository's Pages source has to be "Deploy from a branch" -> `gh-pages` / root.
#
# The branch is rewritten as a single orphan commit on every publish. Its content is disposable -
# the build is reproducible from `dev` - and a 6 MB site committed on every push would otherwise
# grow the repository without bound. Every publishing job therefore fetches the current branch
# first, applies its own change on top, and force-pushes the result; the `gh-pages` concurrency
# group the two publishing jobs share is what keeps them from overwriting each other.
#
# Previews are built from the pull request's own code, so they only run for branches in this
# repository. A fork's `pull_request` run has a read-only token and cannot publish, and
# `pull_request_target` is deliberately not used: it would run fork code with a write token.
name: Pages

on:
  push:
    branches: [dev]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [dev]

# Least privilege: no default token permissions; each job opts in to what it needs.
permissions: {}

jobs:
  build:
    name: Build the site
    # A closed pull request only removes its directory, and a fork cannot publish at all.
    if: |
      github.event_name == 'push' ||
      (github.event.action != 'closed' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      directory: ${{ steps.target.outputs.directory }}
      base: ${{ steps.target.outputs.base }}
      url: ${{ steps.target.outputs.url }}
    steps:
      # A project site lives under the repository's own name, and a preview one level below that.
      - name: Work out where this build is published
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          site="/${GITHUB_REPOSITORY#*/}"

          if [ "$EVENT_NAME" = "push" ]; then
            directory=""
            base="${site}/"
          else
            directory="pr-${PR_NUMBER}"
            base="${site}/${directory}/"
          fi

          {
            echo "directory=${directory}"
            echo "base=${base}"
            echo "url=https://${GITHUB_REPOSITORY_OWNER}.github.io${base}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same cache as the CI build, under its own key: this build differs from it (base href, and
      # the service worker) and must not evict it.
      - name: Cache the Angular build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-pages-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-pages-${{ hashFiles('pnpm-lock.yaml') }}-

      # The base href is what makes a build know its own subdirectory: the router, the bundles, the
      # manifest, and `assetUrl()`/`deploymentSlug()` in the app all read it at runtime. A preview
      # therefore also gets its own database and its own `localStorage`, rather than sharing the
      # demo site's - every path here is the same browser origin.
      - name: Build the demo site
        if: github.event_name == 'push'
        run: pnpm build:pages --base-href "${{ steps.target.outputs.base }}"

      # Previews deliberately ship without the service worker. A worker outlives the directory it
      # was installed from, so a tester who opened a preview once would keep being served that
      # build from their own cache long after the pull request was closed and the files deleted.
      - name: Build the preview
        if: github.event_name == 'pull_request'
        run: pnpm build --base-href "${{ steps.target.outputs.base }}"

      - name: Upload the site
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-site
          path: dist/rebellinnen-kalender/browser
          retention-days: 3
          if-no-files-found: error

  publish:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    # Publishing is serialized across every trigger, because all of them write one branch. Never
    # cancelled mid-run: a cancelled publish would leave the branch half-written.
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Download the site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pages-site
          path: site

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DIRECTORY: ${{ needs.build.outputs.directory }}
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mkdir gh-pages && cd gh-pages
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # A missing branch is the first publish, not an error.
          if git fetch -q --depth 1 origin gh-pages; then
            git checkout -q FETCH_HEAD
          fi

          if [ -z "$DIRECTORY" ]; then
            # The demo site is the root of the branch. Every `pr-*` directory belongs to a pull
            # request and survives.
            find . -mindepth 1 -maxdepth 1 ! -name .git ! -name 'pr-*' -exec rm -rf {} +
            cp -R ../site/. .
          else
            rm -rf "$DIRECTORY"
            mkdir -p "$DIRECTORY"
            cp -R ../site/. "$DIRECTORY/"
          fi

          # Pages answers every missing path with the 404 page at the root of the site, whichever
          # subdirectory was asked for - a 404.html inside one is not documented to be used. The
          # file is the same in every build and carries the redirect that hands a deep link back to
          # its own deployment, so the root copy is refreshed even when a preview was published.
          cp ../site/404.html ./404.html

          # Without it, Pages runs the output through Jekyll, which drops files starting with `_`.
          touch .nojekyll

          # A fresh orphan commit each time, so the branch never accumulates 6 MB per push.
          git checkout -q --orphan published 2>/dev/null || git checkout -q -b published
          git add -A
          git commit -q -m "chore(pages): publish ${DIRECTORY:-site} from ${GITHUB_SHA}"
          git push -q --force origin published:gh-pages

      - name: Comment the preview link on the pull request
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
          PREVIEW_URL: ${{ needs.build.outputs.url }}
        run: |
          set -euo pipefail
          marker='<!-- pages-preview -->'
          body=$(printf '%s\n**Preview:** %s\n\nBuilt from %s. Device calendars and calendar subscriptions do not work in a browser, and the preview keeps its own database - see "Web demo build" in the README.\n' \
            "$marker" "$PREVIEW_URL" "$GITHUB_SHA")

          comment_id=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.body | startswith(\"${marker}\"))] | .[0].id // empty")

          # One comment per pull request, edited on every push rather than repeated.
          if [ -n "$comment_id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" > /dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
              -f body="$body" > /dev/null
          fi

  cleanup:
    name: Remove a closed pull request's preview
    if: |
      github.event_name == 'pull_request' &&
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: gh-pages
      cancel-in-progress: false
    steps:
      - name: Remove the preview directory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          set -euo pipefail
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mkdir gh-pages && cd gh-pages
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git fetch -q --depth 1 origin gh-pages; then
            echo "Nothing published yet."
            exit 0
          fi
          git checkout -q FETCH_HEAD

          if [ ! -d "pr-${PR_NUMBER}" ]; then
            echo "No preview for pull request ${PR_NUMBER}."
            exit 0
          fi

          rm -rf "pr-${PR_NUMBER}"
          git checkout -q --orphan published 2>/dev/null || git checkout -q -b published
          git add -A
          git commit -q -m "chore(pages): remove the preview of pull request ${PR_NUMBER}"
          git push -q --force origin published:gh-pages
