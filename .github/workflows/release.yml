# semantic-release: the only thing in this repository that decides what the version is.
#
# A push to `dev` cuts a prerelease (1.0.0-rc.1, …) for TestFlight and Play internal testing; a push
# to `main` cuts a release (1.0.0, 1.0.1, …). The run tags the commit, writes CHANGELOG.md, bumps
# package.json, regenerates src/app/cross-cutting/infrastructure/app-version.ts and the native
# version fields, commits all of that back to the branch and publishes a GitHub release.
#
# The release commit carries `[skip ci]` and is pushed with GITHUB_TOKEN, which by design does not
# trigger workflows - so it neither loops back into this workflow nor spends a CI run on a commit
# that only moves version numbers.
#
# When branch protection lands (#75), this workflow needs a bypass for `dev` and `main`: it pushes
# straight to the branch rather than opening a pull request, and a protected branch without a bypass
# actor for it will fail the release, not the merge that triggered it.
name: Release

on:
  push:
    branches: [main, dev]

# Least privilege: no default token permissions; the job opts in to what it needs.
permissions: {}

# One group for both branches: a release from `main` and a prerelease from `dev` must never run at
# the same time, or they race on tags. Never cancel a run mid-release - a cancelled run can leave a
# tag without its GitHub release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # Push the release commit and the tag.
      contents: write
      # @semantic-release/github comments on the issues and pull requests a release closes.
      issues: write
      pull-requests: write
    steps:
      # The one place in this repository that keeps the checkout credentials: @semantic-release/git
      # pushes the release commit, and the full history is required to find the last tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release
