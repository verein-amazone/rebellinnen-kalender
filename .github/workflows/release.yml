# semantic-release: the only thing in this repository that decides what the version is.
#
# A push to `dev` cuts a prerelease (1.0.0-rc.1, …) for TestFlight and Play internal testing; a push
# to `main` cuts a release (1.0.0, 1.0.1, …). The run tags the commit, writes CHANGELOG.md, bumps
# package.json, regenerates src/app/cross-cutting/infrastructure/app-version.ts and the native
# version fields, commits all of that back to the branch and publishes a GitHub release.
#
# The release commit carries `[skip ci]` and is pushed with GITHUB_TOKEN, which by design does not
# trigger workflows - so it neither loops back into this workflow nor spends a CI run on a commit
# that only moves version numbers.
#
# Either release continues straight into .github/workflows/store-upload.yml, which builds the tag
# and stages the result: a prerelease from `dev` into TestFlight and Play internal testing, a
# release from `main` into the App Store version and the Play production track. Neither is
# published; both wait for a human in the respective console. Each of the two uploads is gated on
# its own repository variable, so this workflow stays green before the store credentials exist and
# while only one of the two stores is ready.
#
# When branch protection lands (#75), this workflow needs a bypass for `dev` and `main`: it pushes
# straight to the branch rather than opening a pull request, and a protected branch without a bypass
# actor for it will fail the release, not the merge that triggered it.
name: Release

on:
  push:
    branches: [main, dev]

# Least privilege: no default token permissions; the job opts in to what it needs.
permissions: {}

# One group for both branches: a release from `main` and a prerelease from `dev` must never run at
# the same time, or they race on tags. Never cancel a run mid-release - a cancelled run can leave a
# tag without its GitHub release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: semantic-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Set by the exec plugin's `successCmd` (.releaserc.json) once the tag, the release commit and
    # the GitHub release all exist. Absent when the commits produced no release at all.
    outputs:
      released: ${{ steps.semantic-release.outputs.released }}
      version: ${{ steps.semantic-release.outputs.version }}
      tag: ${{ steps.semantic-release.outputs.tag }}
    permissions:
      # Push the release commit and the tag.
      contents: write
      # @semantic-release/github comments on the issues and pull requests a release closes.
      issues: write
      pull-requests: write
    steps:
      # The one place in this repository that keeps the checkout credentials: @semantic-release/git
      # pushes the release commit, and the full history is required to find the last tag.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run semantic-release
        id: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

  # Store uploads happen in the same run, from the tag that was just created. Which platforms
  # actually upload is decided per job inside the called workflow, by one repository variable each,
  # so one store can go live while the other is still waiting for its credentials.
  #
  # The branch decides the channel and nothing else: `dev` stages into TestFlight and the Play
  # internal track, `main` stages into the App Store version and the Play production track. Neither
  # publishes - a release from `main` still ends one deliberate click short of live in both
  # consoles, so merging into `main` can never put a build in front of a user by itself.
  store-upload:
    name: Store upload
    needs: release
    if: needs.release.outputs.released == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/store-upload.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
      channel: ${{ github.ref_name == 'main' && 'release' || 'prerelease' }}
    secrets: inherit
