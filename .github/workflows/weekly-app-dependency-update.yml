# Weekly in-range dependency update: runs scripts/update-app-dependencies.sh (pnpm update within
# the declared semver ranges, then `cap sync` so the committed native projects stay consistent) and
# opens or refreshes a single PR against dev. Range-crossing majors and security advisories are
# Dependabot's job (see .github/dependabot.yml).
#
# Requires the repository setting "Allow GitHub Actions to create and approve pull requests"
# (Settings → Actions → General → Workflow permissions) — without it the final step fails with
# "GitHub Actions is not permitted to create or approve pull requests".
#
# Known limitation: PRs created with the default GITHUB_TOKEN do not trigger the CI workflow.
# Close and reopen the PR (or push to its branch) to get a CI run before merging.
name: Weekly app dependency update

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/weekly-app-dependency-update.yml
      - scripts/update-app-dependencies.sh
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: weekly-app-dependency-update
  cancel-in-progress: true

jobs:
  update:
    name: Run update script and create PR
    # macOS so `cap sync` and xcodebuild can refresh the Swift package graph (Package.resolved).
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout dev
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: dev

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run dependency update script
        run: scripts/update-app-dependencies.sh --summary-markdown "$RUNNER_TEMP/update-summary.md"

      - name: Detect file changes
        id: detect-changes
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected after the dependency update."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No dependency changes detected. Skipping PR creation."
          fi

      - name: Prepare PR body
        id: prepare-pr-body
        if: steps.detect-changes.outputs.has_changes == 'true'
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Automated weekly dependency update"
            echo
            echo "Generated by \`.github/workflows/weekly-app-dependency-update.yml\`."
            echo
            echo "- Workflow run: $RUN_URL"
            echo
            cat "$RUNNER_TEMP/update-summary.md"
            echo
            echo "### Changed files"
            echo
            echo '```text'
            git status --short
            echo '```'
          } > "$RUNNER_TEMP/update-pr-body.md"

          {
            echo "body<<UPDATE_PR_BODY_EOF"
            cat "$RUNNER_TEMP/update-pr-body.md"
            echo "UPDATE_PR_BODY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create pull request
        if: steps.detect-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ github.token }}
          branch: chore/weekly-app-dependency-update
          base: dev
          delete-branch: true
          commit-message: 'chore(deps): weekly app dependency update'
          title: 'chore(deps): weekly app dependency update'
          body: ${{ steps.prepare-pr-body.outputs.body }}
          committer: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
          author: 'github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>'
