# Builds a released tag and hands the result to the stores. Called by .github/workflows/release.yml
# straight after semantic-release, and runnable on its own to retry an upload that failed.
#
# Nothing here reaches a user, on either channel. `channel: prerelease` (a tag cut from `dev`) puts
# the iOS build in TestFlight with its "What to Test" text filled in but no group attached, and the
# Android build on the Play internal track as a draft. `channel: release` (a tag cut from `main`)
# attaches the iOS build to the App Store version with its "What's New" text but does not submit it
# for review, and puts the Android build on the Play production track as a draft. Going live stays a
# deliberate action in each console - which is also what makes a failed upload harmless to retry.
#
# The two channels differ only in the fastlane lane each job runs. Same certificate, same profile,
# same keystore, same service account, same secrets: a release is not a different pipeline, it is
# the same one pointed at a different track.
#
# It builds from the tag rather than reusing CI's `dist` artifact, deliberately: that artifact
# belongs to the commit *before* the release commit and to a different workflow run, and an upload
# has to be reproducible from the tag alone.
#
# Each job is gated on its own repository variable - TESTFLIGHT_UPLOADS_ENABLED and
# PLAY_UPLOADS_ENABLED - rather than on a single switch for both. The two stores are set up at
# different times and by different people, and one platform waiting for credentials must not turn
# every release run red. A job whose variable is not `true` reports as skipped, which is green.
# The gates apply to a manual run as well, deliberately: there is no way to upload past a store
# that is not ready.
#
# The release has already happened by the time this runs, so a failed upload leaves the tag and the
# GitHub release behind. That is the lesser evil - unpublishing a release is worse than a build that
# never reached a tester. Re-run this workflow for the same tag; the build number is derived from
# the version, so a retry produces the identical build number, which both stores reject as a
# duplicate. If the first attempt already uploaded, cut a new version instead - an empty commit on
# `dev` for an rc, a fix released through `main` for a release (see docs/release.md).
#
# Re-running only the failed job, rather than the whole workflow, is the usual move: the two stores
# fail independently and the one that already uploaded must not be asked to do it again.
name: Store upload

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and upload, for example v1.0.0-rc.2.
        required: true
        type: string
      channel:
        description: >-
          prerelease - TestFlight and the Play internal track, for a tag cut from dev.
          release - the App Store version and the Play production track, for a tag cut from main.
          Both stage only; neither publishes.
        required: false
        default: prerelease
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and upload, for example v1.0.0-rc.2.
        required: true
        type: string
      channel:
        description: Which store channel to stage the tag into. Neither option publishes anything.
        required: false
        default: prerelease
        type: choice
        options: [prerelease, release]

# Least privilege: no default token permissions; each job opts in to what it needs.
permissions: {}

# Two uploads of the same tag must never overlap; different tags may.
concurrency:
  group: store-upload-${{ inputs.tag }}
  cancel-in-progress: false

env:
  # fastlane refuses to run under a non-UTF-8 locale, and neither runner image sets one.
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  FASTLANE_OPT_OUT_USAGE: 'true'

jobs:
  testflight:
    name: ${{ inputs.channel == 'release' && 'App Store' || 'TestFlight' }}
    if: vars.TESTFLIGHT_UPLOADS_ENABLED == 'true'
    runs-on: macos-latest
    # One environment for both channels: the App Store Connect key, the match passphrase and the
    # deploy key are the same credentials whichever track the build is staged into, and a second
    # environment would only be a second copy of them to keep in sync.
    environment: testflight
    # The archive dominates the run; `pilot` then waits only until the build appears in App Store
    # Connect, long enough to attach the release notes, and leaves the rest of Apple's processing to
    # finish on its own.
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Ruby
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          bundler-cache: true

      # Not optional: ios/App/CapApp-SPM/Package.swift references every Capacitor plugin by its
      # exact node_modules/.pnpm/<name>@<version> path.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The same cache the CI build job keeps, for the same reason: a release builds the web app
      # too, and Angular's disk cache is what makes that build cheap. See .github/workflows/ci.yml
      # for why the key ends in the commit.
      - name: Cache the Angular build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-store-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-store-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build the web app
        run: pnpm build

      - name: Sync the iOS project
        run: pnpm exec cap sync ios

      # gym resolves the Swift packages itself before it archives, so without this every release
      # clones SQLCipher, ZIPFoundation and capacitor-swift-pm from github.com again. The key is the
      # one the CI iOS job writes, deliberately - the clones are the same, so a release reads what
      # the last CI run on this branch already stored. It buys a handful of seconds; what it really
      # buys is a step that no longer needs github.com to be up, at the point in the run where the
      # tag and the GitHub release already exist and a failure is expensive.
      - name: Cache resolved Swift packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/spm
          key: ${{ runner.os }}-spm-${{ hashFiles('ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build the store release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/build-store-release-notes.mjs --tag "$TAG" --out-dir "$RUNNER_TEMP/notes"

      # match reads the certificates repository over SSH. The app repository itself was checked out
      # over HTTPS, so forcing this identity for github.com affects nothing else in the run.
      - name: Give match read access to the certificates repository
        env:
          MATCH_DEPLOY_KEY: ${{ secrets.MATCH_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$MATCH_DEPLOY_KEY" > ~/.ssh/match_deploy_key
          chmod 600 ~/.ssh/match_deploy_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          printf 'Host github.com\n  IdentityFile ~/.ssh/match_deploy_key\n  IdentitiesOnly yes\n' \
            >> ~/.ssh/config

      # `ios release` needs the marketing version to know which App Store version to edit or create.
      # A tag from `main` never carries a prerelease suffix, so stripping the leading `v` is enough.
      - name: Archive and stage the build
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_P8_BASE64 }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          CHANNEL: ${{ inputs.channel }}
          TAG: ${{ inputs.tag }}
          # Read by the Fastfile and passed to build_app; unset outside CI.
          SPM_CLONE_PATH: ${{ runner.temp }}/spm
        run: |
          notes="$(cat "$RUNNER_TEMP/notes/testflight.txt")"
          if [ "$CHANNEL" = 'release' ]; then
            bundle exec fastlane ios release \
              version:"${TAG#v}" \
              changelog:"$notes"
          else
            bundle exec fastlane ios beta changelog:"$notes"
          fi

      - name: Upload the build log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fastlane-ios-logs
          path: |
            ~/Library/Logs/gym
            fastlane/report.xml
          retention-days: 7
          if-no-files-found: ignore

  play-internal:
    name: ${{ inputs.channel == 'release' && 'Play production' || 'Play internal testing' }}
    if: vars.PLAY_UPLOADS_ENABLED == 'true'
    runs-on: ubuntu-latest
    # One environment for both channels, for the same reason as the iOS job above: the upload
    # keystore and the service account do not change with the track.
    environment: play-internal
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Set up Ruby
        uses: ruby/setup-ruby@bec3f19a76460dbe12f60def7d1a77585f07516c # v1.322.0
        with:
          bundler-cache: true

      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # See the iOS job above.
      - name: Cache the Angular build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .angular/cache
          key: ${{ runner.os }}-angular-store-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-angular-store-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build the web app
        run: pnpm build

      - name: Sync the Android project
        run: pnpm exec cap sync android

      - name: Build the store release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: node scripts/build-store-release-notes.mjs --tag "$TAG" --out-dir "$RUNNER_TEMP/notes"

      - name: Decode the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"

      - name: Build the release bundle
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/upload-keystore.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon

      # Without the signing environment the Gradle build silently produces an unsigned bundle, which
      # Play rejects only after the upload. Catch it here, where the message is readable.
      - name: Check that the bundle is signed
        run: |
          if ! jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab \
            | grep -q 'jar verified'; then
            echo 'The release bundle is not signed - check the ANDROID_KEYSTORE_* secrets.' >&2
            exit 1
          fi

      - name: Upload to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$CHANNEL" = 'release' ]; then
            bundle exec fastlane android production
          else
            bundle exec fastlane android internal
          fi

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"
